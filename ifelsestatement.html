<!doctype html>
<html>

<head><title>Elseif statement</title>
</head>

<body>
<script>

var m= prompt("Enter marks");

if((m<=30))
{
document.write("Fail");
}
else if ((m<=40))
{
document.write("pass");
}
else if ((m<=60))
{
document.write("good");
}
else
{
document.write("very good");
}
</script>
</body>
</html>
